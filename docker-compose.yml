version: "3.9"

# ============================================================
# MetalSync – GAPTECH USINAGEM E FERRAMENTARIA LTDA
# Módulo 2 – Infraestrutura e Mocks
# ============================================================

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}

x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}
  DB_NAME: ${DB_NAME}

services:

  # ── Broker ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: metalsync-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metalsync-net

  # ── Serviço: Pedido (8001) ─────────────────────────────────
  servico-pedido:
    build:
      context: ./servicos/pedido
    container_name: metalsync-pedido
    ports:
      - "${SERVICO_PEDIDO_PORT:-8001}:8001"
    environment:
      <<: [*rabbitmq-env, *db-env]
      ENV: ${ENV:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - metalsync-net
    restart: unless-stopped

  # ── Serviço: Pagamento (8002) ──────────────────────────────
  servico-pagamento:
    build:
      context: ./servicos/pagamento
    container_name: metalsync-pagamento
    ports:
      - "${SERVICO_PAGAMENTO_PORT:-8002}:8002"
    environment:
      <<: [*rabbitmq-env, *db-env]
      ENV: ${ENV:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - metalsync-net
    restart: unless-stopped

  # ── Serviço: Logística (8003) ──────────────────────────────
  servico-logistica:
    build:
      context: ./servicos/logistica
    container_name: metalsync-logistica
    ports:
      - "${SERVICO_LOGISTICA_PORT:-8003}:8003"
    environment:
      <<: [*rabbitmq-env, *db-env]
      ENV: ${ENV:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - metalsync-net
    restart: unless-stopped

  # ── Mock: Antifraude ───────────────────────────────────────
  mock-antifraude:
    build:
      context: ./mocks
    container_name: metalsync-mock-antifraude
    command: ["python", "mock_antifraude.py"]
    environment:
      <<: *rabbitmq-env
      TAXA_ANTIFRAUDE: ${TAXA_ANTIFRAUDE:-1}
      PROB_APROVACAO_FRAUDE: ${PROB_APROVACAO_FRAUDE:-0.90}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - metalsync-net
    restart: unless-stopped

  # ── Mock: Catálogo GAPTECH ─────────────────────────────────
  mock-catalogo:
    build:
      context: ./mocks
    container_name: metalsync-mock-catalogo
    command: ["python", "mock_catalogo.py"]
    environment:
      <<: *rabbitmq-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - metalsync-net
    restart: unless-stopped

  # ── Dashboard (8050) ───────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
    container_name: metalsync-dashboard
    ports:
      - "${DASHBOARD_PORT:-8050}:8050"
    environment:
      <<: [*rabbitmq-env, *db-env]
      ENV: ${ENV:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
      servico-pedido:
        condition: service_started
      servico-pagamento:
        condition: service_started
      servico-logistica:
        condition: service_started
    networks:
      - metalsync-net
    restart: unless-stopped

networks:
  metalsync-net:
    driver: bridge
    name: metalsync-net
